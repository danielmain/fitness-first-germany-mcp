[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fitness-first-germany-mcp"
version = "0.1.0"
description = "MCP server for Fitness First Germany courses, bookings, and profile"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.23.0,<2",
    "python-dotenv>=1.0.0",
]

[project.scripts]
fitness-first-germany-mcp = "fitness_first_germany_mcp:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/fitness_first_germany_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
